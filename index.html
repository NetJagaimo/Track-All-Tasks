<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track All Tasks - 任務時間追蹤器</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <div id="app">
      <!-- 標題區域 -->
      <header class="header">
        <h1>Track All Tasks</h1>
        <p class="subtitle">專注每一刻，追蹤每項任務</p>
      </header>

      <!-- 主要計時器區域 -->
      <main class="main-content">
        <!-- 當前任務狀態 -->
        <section class="current-task">
          <div class="timer-display">
            <div class="time" id="timer-display">00:00</div>
            <div class="task-name" id="current-task-name">無進行中的任務</div>
          </div>
          
          <div class="task-status" id="task-status">
            <span class="status-indicator" id="status-indicator">⏸️</span>
            <span class="status-text" id="status-text">待機中</span>
          </div>
        </section>

        <!-- 任務輸入區域 -->
        <section class="task-input">
          <div class="input-group">
            <input 
              type="text" 
              id="task-input" 
              placeholder="輸入任務名稱..." 
              maxlength="100"
              autocomplete="off"
            />
            
            <!-- 最近任務下拉選單 -->
            <div class="recent-tasks" id="recent-tasks-dropdown" style="display: none;">
              <div class="recent-header">最近使用的任務</div>
              <div class="recent-list" id="recent-tasks-list"></div>
            </div>
          </div>

          <!-- 控制按鈕 -->
          <div class="controls">
            <button id="start-btn" class="btn btn-primary">
              <span class="btn-icon">▶️</span>
              <span class="btn-text">開始</span>
            </button>
            
            <button id="stop-btn" class="btn btn-secondary" disabled>
              <span class="btn-icon">⏹️</span>
              <span class="btn-text">停止</span>
            </button>
          </div>
        </section>

        <!-- 今日統計 -->
        <section class="today-stats">
          <h3>今日統計</h3>
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-value" id="today-tasks-count">0</div>
              <div class="stat-label">完成任務</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="today-total-time">00:00</div>
              <div class="stat-label">總計時間</div>
            </div>
          </div>
        </section>

        <!-- 任務統計預覽 -->
        <section class="task-statistics-preview">
          <div class="section-header">
            <h3>任務統計</h3>
            <div class="statistics-tabs">
              <button id="today-stats-tab" class="stats-tab active">今日</button>
              <button id="all-stats-tab" class="stats-tab">全部</button>
              <button id="history-tab" class="stats-tab">歷史</button>
              <button id="search-tab" class="stats-tab">搜尋</button>
            </div>
          </div>
          <div class="statistics-content">
            <div id="today-statistics" class="statistics-list active">
              <div class="empty-state">
                <div class="empty-icon">📊</div>
                <div class="empty-text">今日尚無任務記錄</div>
              </div>
            </div>
            <div id="all-statistics" class="statistics-list">
              <div class="empty-state">
                <div class="empty-icon">📈</div>
                <div class="empty-text">尚無任務記錄</div>
              </div>
            </div>
            <div id="history-statistics" class="statistics-list">
              <div class="quick-filters">
                <button class="filter-btn active" data-period="week">本週</button>
                <button class="filter-btn" data-period="month">本月</button>
                <button class="filter-btn" data-period="all">全部</button>
              </div>
              <div id="date-stats-container">
                <div class="empty-state">
                  <div class="empty-icon">📅</div>
                  <div class="empty-text">載入歷史統計中...</div>
                </div>
              </div>
            </div>
            <div id="search-statistics" class="statistics-list">
              <div class="search-container">
                <div class="search-form">
                  <div class="search-row">
                    <div class="search-field">
                      <label for="search-task-name">任務名稱</label>
                      <input type="text" id="search-task-name" placeholder="搜尋任務..." />
                    </div>
                    <div class="search-field">
                      <label for="search-start-date">開始日期</label>
                      <input type="date" id="search-start-date" />
                    </div>
                    <div class="search-field">
                      <label for="search-end-date">結束日期</label>
                      <input type="date" id="search-end-date" />
                    </div>
                    <div class="search-actions">
                      <button id="search-btn" class="search-btn">搜尋</button>
                      <button id="clear-search-btn" class="search-btn secondary">清除</button>
                    </div>
                  </div>
                </div>
              </div>
              <div id="search-results-container">
                <div class="empty-state">
                  <div class="empty-icon">🔍</div>
                  <div class="empty-text">輸入搜尋條件開始查詢</div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- 底部工具列 -->
      <footer class="footer">
        <div class="footer-actions">
          <button id="export-btn" class="btn btn-outline">
            <span class="btn-icon">📤</span>
            匯出
          </button>
          
          <button id="settings-btn" class="btn btn-outline">
            <span class="btn-icon">⚙️</span>
            設定
          </button>
        </div>
      </footer>
    </div>

    <!-- 引入主要 JavaScript -->
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/global-shortcuts.js"></script>
    <script type="module" src="/src/task-statistics.js"></script>
    <script type="module" src="/src/task-query.js"></script>
    <script type="module" src="/src/task-export.js"></script>
    <script type="module" src="/src/task-edit.js"></script>
    
    <!-- 開發階段：引入測試工具 -->
    <script type="module" src="/src/timer-test.js"></script>
    <script type="module" src="/src/tray-test.js"></script>
    <script type="module" src="/src/tray-menu-test.js"></script>
    <script type="module" src="/src/task-input-test.js"></script>
    <script type="module" src="/src/shortcut-test.js"></script>
    <script type="module" src="/src/task-statistics-test.js"></script>
  </body>
</html>
